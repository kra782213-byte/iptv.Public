name: Listeyi olustur

on:
  push:
    paths:
      - "filmler.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  olustur:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Listeyi uret
        run: python3 olustur.py

      - name: Git adi
        run: git config user.name "liste-botu"

      - name: Git e-posta
        run: git config user.email "liste-botu@users.noreply.github.com"

      - name: Dosyalari ekle
        run: git add -A

      - name: Kaydet
        run: git diff --cached --quiet || git commit -m "Liste guncellendi"

      - name: Gonder
        run: git push
